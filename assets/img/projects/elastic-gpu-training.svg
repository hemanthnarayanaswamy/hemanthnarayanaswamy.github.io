<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Elastic GPU Training Platform architecture overview</title>
<desc id="desc">Moved YOLO training from a single on-premises GPU server to a GitOps-managed GKE platform, using queued Spot GPU jobs and scale-to-zero capacity.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b30"/><stop offset="1" stop-color="#070e1c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<circle cx="790" cy="90" r="290" fill="url(#glow)"/>
<g fill="none" stroke="#25344d" stroke-width="1" opacity=".6"><path d="M0 100H900M0 200H900M0 300H900M0 400H900M0 500H900M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600M800 0V600"/></g>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="56" y="51" width="8" height="26" rx="4" fill="#a78bfa"/>
<text x="80" y="73" fill="#a78bfa" font-size="23" font-weight="700" letter-spacing="2">ELASTIC GPU TRAINING</text>
<text x="56" y="184" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-2">6h → 2h</text>
<text x="56" y="270" fill="#a78bfa" font-size="66" font-weight="700" letter-spacing="-1">dataset to model</text>
<path d="M280 418H340M550 418H610" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="370" width="210" height="96" rx="18" fill="#152239" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="94" cy="394" r="5" fill="#a78bfa"/><text x="175" y="430" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="600">Dataset</text>
<rect x="340" y="370" width="210" height="96" rx="18" fill="#152239" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="364" cy="394" r="5" fill="#a78bfa"/><text x="445" y="430" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="600">Job queue</text>
<rect x="610" y="370" width="210" height="96" rx="18" fill="#152239" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="634" cy="394" r="5" fill="#a78bfa"/><text x="715" y="430" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="600">Spot GPU</text>
<text x="56" y="550" fill="#a9b7cb" font-size="22">GKE · Argo Workflows · Kueue · Scale to zero</text>
</g>
</svg>
