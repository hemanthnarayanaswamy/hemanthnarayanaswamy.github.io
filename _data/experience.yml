- role: DevOps Developer
  company: Promark Electronics · Montreal, QC
  logo:
    path: /assets/img/organizations/promark.svg
    alt: Promark Electronics logo
  start: 2023-05-01
  end: 2026-10-01
  summary: >-
    Worked across the **KonnectAI product team** and **internal IT Operations** at
    Promark Electronics, part of Electrical Components International (ECI).
    Built and operated infrastructure for an AI visual-inspection platform while
    automating the plant's IT and business systems.
  sections:
    - title: KonnectAI & Computer Vision Team
      focus: MLOps · Infrastructure · DevOps · Cloud Operations
      highlights:
        - >-
          Designed reusable **Terraform modules** for a multi-tenant visual-inspection
          SaaS on Google Cloud. Managed **30 isolated customer projects across four
          regions**, reducing onboarding from **1–2 days to a few hours**.
        - >-
          Migrated YOLO training from an on-premises GPU server to a **GitOps-managed
          GKE platform**. Used Argo Workflows and Kueue to schedule jobs on Spot
          NVIDIA L4 GPU pools that scale to zero, cutting dataset-to-model time
          from **six hours to two**.
        - >-
          Replaced manual SSH/tmux deployments across **50–70 factory inspection
          stations** with GitHub Actions self-hosted runners and Docker Compose.
          Implemented **NGINX blue/green releases with WebSocket-aware sticky
          routing** to preserve live Socket.IO inspection sessions during deployments.
        - >-
          Built GitHub Actions pipelines with **keyless Workload Identity Federation**,
          removing the need for stored, long-lived cloud credentials.
        - >-
          Added SonarQube, static analysis, and **Trivy container and IaC scanning**
          as quality gates that block builds with critical CVEs.
        - >-
          Streamed GCP billing exports and Firestore inspection data into **BigQuery**.
          Built Looker dashboards for per-client cost and usage, and model detection trends.
        - >-
          Set up **Prometheus, Grafana, and Cloud Logging** monitoring, routing
          alerts to Slack and Teams for incident response.
        - >-
          Managed secrets, identity, and access with **IAM, HashiCorp Vault, and GCP KMS**.
    - title: ECI / Promark IT Operations Team
      focus: IT Operations · Automation · Observability
      highlights:
        - >-
          Built a **Python integration** using the SAP Business One Service Layer,
          VKS API, SQL Server triggers, and Agent jobs to automate work-order
          handoffs between the ERP and shop floor.
        - >-
          Delivered **Power BI dashboards** backed by optimized SQL Server queries
          over SAP Business One for finance and operations reporting.
        - >-
          Automated **zero-touch Linux provisioning** with Ubuntu autoinstall,
          idempotent Ansible roles, and Bash. Reduced server builds from **two days
          to three hours** and eliminated configuration drift between test and production.
        - >-
          Administered **25–30 Linux servers** running ERP systems and internal tools.
          Standardized patching, UFW/iptables firewalls, CIS-aligned SSH hardening,
          and TLS certificate renewal with Ansible and Bash, with **zero certificate
          expiry outages**.
  tools:
    - GCP (GKE, Cloud Run, BigQuery, Firestore, Cloud SQL, Cloud Functions, KMS)
    - Terraform
    - Terragrunt
    - Ansible
    - Kubernetes
    - Docker
