    highlights: ["Reduced dataset-to-model time from six hours to two.","Scheduled training with Argo Workflows and Kueue on NVIDIA L4 Spot pools."]
    technologies: ["GKE","Argo Workflows","Kueue","GitOps","Spot GPUs"]
    metric: "6h → 2h"
    metric_label: "Dataset-to-model time"
